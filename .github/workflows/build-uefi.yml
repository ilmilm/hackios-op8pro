name: build-uefi
on:
  workflow_dispatch:
  push:
    branches: [instantnoodlep]
    paths: ['uefi/**', 'xnuloader/**', '.github/workflows/build-uefi.yml']

jobs:
  uefi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm acpica-tools uuid-dev \
            build-essential gcc-aarch64-linux-gnu clang lld llvm python3-venv git mono-runtime ca-certificates-mono
      - name: apply the Mu-Silicium port
        run: uefi/apply.sh
      - name: python venv
        run: |
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt
      - name: build the 8 Pro UEFI (instantnoodlepPkg)
        run: |
          cd Mu-Silicium
          source ../venv/bin/activate
          set -x
          for attempt in 1 2 3; do
            python3 build_uefi.py -d instantnoodlep -r RELEASE -u && break
            echo "build attempt $attempt failed; retrying"
            sleep 15
          done
      - name: build the XNU loader
        run: |
          cd xnuloader
          ./build.sh
      - name: assemble the fastboot boot image
        run: |
          export UEFI_TARGET=instantnoodlep FD_BASE=0x9FC00000 FD_SIZE=0x300000 PAYLOAD_BASE=0xF0000000
          python3 xnuloader/mkpayload.py loader.efi=xnuloader/loader.efi --usb -o out-payload.bin
          find Mu-Silicium -iname "*.fd" | head -4 || true
          export UEFI_FD=$(find Mu-Silicium -iname "SILICIUM_UEFI.fd" | head -1)
          echo "UEFI_FD=$UEFI_FD"
          python3 mkxnuimg.py -p out-payload.bin -o instantnoodlep-boot.img
          cp "${UEFI_FD:-missing}" . 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: instantnoodlep-uefi
          path: |
            SILICIUM_UEFI.fd
            instantnoodlep-boot.img
            xnuloader/loader.efi
